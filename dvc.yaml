# Pipeline do projeto. `dvc repro` só reexecuta o estágio cujas deps ou params mudaram, então
# TODO arquivo de código que o estágio importa entra em `deps`: um import fora da lista seria
# uma dependência implícita, e o DVC diria "up to date" sobre um resultado velho.
stages:
  # O zip chega por `dvc import-url` (data/raw/online_shoppers_intention.zip.dvc), não por
  # remote: num clone limpo, `dvc update` baixa da UCI e este estágio extrai o CSV.
  extract:
    cmd: extract
    deps:
      - data/raw/online_shoppers_intention.zip
      - src/purchase_propensity/extract.py
      - src/purchase_propensity/schema.py
    outs:
      - data/raw/online_shoppers_intention.csv
  prepare:
    cmd: prepare
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/purchase_propensity/prepare.py
      - src/purchase_propensity/params.py
      - src/purchase_propensity/schema.py
    params:
      - configs/params.yaml:
          - prepare
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: train
    deps:
      - data/processed/train.csv
      - src/purchase_propensity/train.py
      - src/purchase_propensity/models.py
      - src/purchase_propensity/params.py
      - src/purchase_propensity/schema.py
      - src/purchase_propensity/tracking.py
    params:
      # `prepare` também: o split define o run, e os dois blocos vão para o MLflow.
      - configs/params.yaml:
          - prepare
          - train
    outs:
      - models/model.joblib
    metrics:
      # cache: false = o JSON vai para o Git, legível no diff e no `dvc metrics diff`.
      - metrics/cv.json:
          cache: false
