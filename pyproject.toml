# Metadados no padrão PEP 621 (`[project]`), lido por qualquer ferramenta. Em `[tool.poetry]`
# fica só o que é do Poetry: o layout `src/` e o grupo dev (decision log §2).
[project]
name = "tc-mle-fase2"
version = "0.1.0"
description = "Propensão de compra em e-commerce: pipeline de ML reprodutível (Poetry, DVC, MLflow, Docker)"
authors = [{ name = "Luca Stephan" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    # Em produção porque o container executa o pipeline com `dvc repro` (decision log §3).
    "dvc (>=3.67.1,<4.0.0)",
    # Já vem com o scikit-learn, mas o train.py importa direto (decision log §3).
    "joblib (>=1.6.0,<2.0.0)",
    # Completo, não o `mlflow-skinny`: o backend SQLite e o Registry precisam do SQLAlchemy.
    "mlflow (>=3.17.2,<4.0.0)",
    # Nada lê o `.env` sozinho, nem o MLflow nem o DVC: o `main()` carrega (decision log §4).
    "python-dotenv (>=1.2.4,<2.0.0)",
    # Lê commit e estado do código sem o binário `git`, que a imagem slim não tem. Já vinha
    # com o DVC, mas o tracking.py importa direto (decision log §4).
    "dulwich (>=1.2.17,<2.0.0)",
]

# Um executável por estágio do pipeline. O mesmo nome aparece no `cmd` do dvc.yaml, no
# README e no container (D02-A4).
[project.scripts]
extract = "purchase_propensity.extract:main"
prepare = "purchase_propensity.prepare:main"
train = "purchase_propensity.train:main"
# Fora do dvc.yaml: escolhe entre os runs já feitos e registra o champion (decision log §4).
promote = "purchase_propensity.promote:main"
evaluate = "purchase_propensity.evaluate:main"
# Fora do dvc.yaml: lê o modelo pelo alias do Registry, que não é `dep` (decision log §4).
predict = "purchase_propensity.predict:main"

[tool.poetry]
packages = [{ include = "purchase_propensity", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.0"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Lint ------------------------------------------------------------------
# O critério "Clean code e Estrutura" (20%) cobra naming, type hints e legibilidade.
# Cada um tem aqui uma regra que FALHA no CI, para que a entrega prove em vez de afirmar
# (D01-A1, decision log §1).
[tool.ruff]
line-length = 90
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: import morto, variável não usada
    "I",        # isort: ordem de imports estável entre máquinas
    "N",        # pep8-naming: snake_case, CapWords, CONSTANTES
    "UP",       # pyupgrade
    "B",        # bugbear: default mutável e afins
    "SIM",      # simplificações
    "ANN",      # type hints em parâmetro E retorno: requisito nominal do enunciado
    "D",        # docstrings: requisito nominal do enunciado
    "C90",      # complexidade ciclomática
    "PL",       # pylint: tamanho de função, nº de argumentos
    "ERA",      # código comentado: código morto que alguém pode "religar"
    "PD",       # pandas-vet
    # RUF100 acusa `# noqa` que não suprime nada. Um noqa é uma afirmação sobre esta
    # configuração; sem RUF100, ninguém verifica a afirmação (achado do M03-A06, Fase 1).
    "RUF",
]
ignore = [
    "D100",     # docstring de módulo: o nome do arquivo + a docstring das funções bastam
    "D104",     # docstring de pacote: idem, para __init__.py
]

# `X`/`X_train` é a convenção do scikit-learn (matriz maiúscula, vetor minúsculo) e a que a
# D01-A7 recomenda. O pep8-naming reprovaria (N803/N806). A exceção cobre só esses nomes, e o
# resto do naming continua verificado (`Data`, `Xtrain` ainda reprovam).
[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Testes são lidos pelo nome (`test_alvo_nao_entra_nas_features`). Exigir type hint e
# docstring neles duplicaria o nome sem acrescentar informação.
"tests/**" = ["ANN", "D", "PLR2004"]

# --- Testes ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Vem de dentro do MLflow (store SQLite), não do nosso código; sai quando o MLflow
    # trocar a estratégia de carga. Filtrado pela mensagem, não pela categoria inteira.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Também interno: sai ao importar `mlflow.types.responses` (modelos de agente/chat),
    # que o MLflow carrega ao inferir a assinatura de qualquer modelo.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
]
