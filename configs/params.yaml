# Todo número que muda um resultado do pipeline mora aqui. O dvc.yaml declara, por estágio,
# quais chaves cada um lê: mudar uma delas invalida o cache só dos estágios afetados.

prepare:
  test_size: 0.2  # fração reservada ao teste, tocado uma única vez na Etapa 4
  seed: 42

train:
  model: logistic_regression  # chave de MODEL_FACTORIES (models.py); a escolha final é da Etapa 4
  use_page_values: true  # false = experimento sem o quase-vazamento (estudo do dataset, §4.1)
  min_frequency: 10  # categoria com menos linhas no treino vira "infrequente" no one-hot
  cv_folds: 5
  seed: 42  # semente própria: mudar a CV não refaz o split do prepare

# Critério de promoção ao Registry, commitado ANTES dos runs da entrega: a data do commit é
# a prova de que a regra foi escrita antes de medir. Nenhum estágio do dvc.yaml lê este
# bloco; quem lê é o comando `promote`, que roda fora do DVC (decision log §4).
promotion:
  model_name: purchase-propensity  # nome no Registry
  alias: champion
  metric: cv_pr_auc_mean  # chave do run; a mesma dos dois lados da comparação
  baseline_model: dummy  # o piso é um run do mesmo commit e dado, não um número
  margin_in_stds: 1.0  # o candidato supera piso e champion por mais que N desvios da CV dele
