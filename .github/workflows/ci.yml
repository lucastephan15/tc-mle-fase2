name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mesma versão do Poetry da máquina de desenvolvimento: o formato do poetry.lock
      # depende dela.
      - run: pipx install poetry==1.8.4
      - run: poetry install --no-interaction
      - run: make ci
